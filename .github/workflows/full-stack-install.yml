name: Full Render build and seven real package checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render-build.sh
      - scripts/verify_production_probe.py
      - scripts/availability_report.py
      - .github/workflows/full-stack-install.yml
      - scientific_toolkit_mcp/tools.py
      - scientific_toolkit_mcp/oauth.py
      - scientific_toolkit_mcp/production_probe.py
      - tests/test_availability_report.py
      - pyproject.toml
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Explicitly validate the combined production installation, not only isolated wheels.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - run: bash scripts/render-build.sh
      # The committed availability.json is a generated artifact; regenerate it
      # here, where all seven CLIs are genuinely installed, and publish it as
      # this run's evidence. It is never hand-edited.
      - name: Regenerate the availability report with all seven CLIs
        env:
          SCITOOL_REASON_BIN: ${{ github.workspace }}/.reason-env/bin/axiomize-reason
        run: python scripts/availability_report.py --output tests/e2e/results/availability.json
      - name: Upload the freshly generated availability report
        uses: actions/upload-artifact@v7
        with:
          name: availability-report
          path: tests/e2e/results/availability.json
          if-no-files-found: error
      - name: Test seven installed CLI adapters
        env:
          SCITOOL_REASON_BIN: ${{ github.workspace }}/.reason-env/bin/axiomize-reason
        run: |
          for profile in axiomize scientific-computing-system scientific-computing-system-2.0 plan-auditor quantum-reasoning-skill axiomize-quantum-skills-2.0 eq-layer; do
            python scripts/upstream_smoke.py "$profile"
          done
      - name: Verify authenticated live-process MCP adapters with CI-only token
        run: python scripts/verify_production_probe.py
      - name: Install complete test prerequisites
        run: python -m pip install "pytest>=8" "pytest-cov>=5" "mcp>=1.15,<2"
      - name: Test seven real adapters with full coverage
        run: python -m pytest -q -rs tests/ --cov=scientific_toolkit_mcp --cov-branch --cov-report=term-missing --cov-fail-under=100
