name: Publish Python package to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag, package name, and version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          package_name = "furox-scientific-toolkit-mcp"
          version = metadata["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert metadata["name"] == package_name, f"Unexpected distribution name: {metadata['name']}"
          assert tag == f"v{version}", f"Release tag {tag} does not match package version v{version}"
          init = Path("scientific_toolkit_mcp/__init__.py").read_text(encoding="utf-8")
          assert f'__version__ = "{version}"' in init, "Package __version__ must match pyproject"
          print(f"Validated {package_name} version {version} against tag {tag}")
          PY

      - name: Install test and build dependencies
        run: python -m pip install --upgrade ".[oauth]" build twine

      - name: Test MCP server
        run: python -m unittest discover -s tests -v

      - name: Build source and wheel distributions
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Smoke-test installed wheel away from checkout
        run: |
          python -m pip install --force-reinstall dist/*.whl
          (cd /tmp && python -c 'import importlib.metadata as meta; import scientific_toolkit_mcp; assert meta.version("furox-scientific-toolkit-mcp") == scientific_toolkit_mcp.__version__; import scientific_toolkit_mcp.server; print("Installed wheel import PASS")')

      - name: Save verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI via trusted OIDC
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/furox-scientific-toolkit-mcp
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish without a long-lived API token
        uses: pypa/gh-action-pypi-publish@release/v1
