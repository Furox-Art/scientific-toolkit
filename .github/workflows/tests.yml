name: MCP test suite
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The e2e suite drives the seven real tool CLIs, so CI must install them
      # exactly like the Render build does (see scripts/render-build.sh).
      - run: bash scripts/render-build.sh
      - name: Run tests
        env:
          SCITOOL_REASON_BIN: ${{ github.workspace }}/.reason-env/bin/axiomize-reason
        run: python -m unittest discover -s tests -v

  package-artifacts:
    name: Build and smoke-test PyPI artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Install built wheel and verify import
        run: |
          python -m pip install --force-reinstall dist/*.whl
          (cd /tmp && python -c 'import importlib.metadata as meta; import scientific_toolkit_mcp; assert meta.version("furox-scientific-toolkit-mcp") == scientific_toolkit_mcp.__version__; import scientific_toolkit_mcp.server; print("Packaged import PASS")')
