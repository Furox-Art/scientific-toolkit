name: MCP test suite
on:
  push:
    # Branch changes are tested on pull_request; avoid duplicate push jobs.
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # literature-evidence-mcp requires Python >=3.11, so the full
        # nine-adapter suite is exercised on 3.11 and newer.
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      # The e2e suite drives the nine real upstream tools, so CI installs the
      # sibling repositories from source (see scripts/render-build.sh; Render
      # itself installs the released distributions from PyPI).
      - run: bash scripts/render-build.sh
      - name: Install test prerequisites from the package test extra
        # The test extra is the single source of truth for pytest, coverage and
        # the MCP SDK version, so CI cannot drift from a local `.[test]` install.
        run: python -m pip install -e ".[test]"
      - name: Run tests with 100% branch coverage and no skips
        env:
          SCITOOL_REASON_BIN: ${{ github.workspace }}/.reason-env/bin/axiomize-reason
        run: python -m pytest -q -rs tests/ --cov=scientific_toolkit_mcp --cov-branch --cov-report=term-missing --cov-fail-under=100

  package-artifacts:
    name: Build and smoke-test PyPI artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Audit built distribution set
        run: |
          python - <<'PY'
          import re, tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          version = metadata["version"]
          prefix = re.sub(r"[-_.]+", "_", metadata["name"]) + "-" + version
          dist = sorted(path.name for path in Path("dist").iterdir() if path.is_file())
          sdists = [name for name in dist if name.endswith(".tar.gz")]
          wheels = [name for name in dist if name.endswith(".whl")]
          assert len(sdists) == 1, f"expected exactly one sdist, found {sdists}"
          assert len(wheels) == 1, f"expected exactly one wheel, found {wheels}"
          assert sdists[0] == f"{prefix}.tar.gz", f"unexpected sdist name {sdists[0]!r}"
          assert wheels[0].startswith(f"{prefix}-") and wheels[0].endswith(".whl"), wheels[0]
          print(f"Validated distribution set for {metadata['name']} {version}:")
          for name in dist:
              print(f"  {name}")
          PY
      - name: Install built wheel and verify import
        run: |
          python -m pip install --force-reinstall dist/*.whl
          (cd /tmp && python -c 'import importlib.metadata as meta; import scientific_toolkit_mcp; assert meta.version("scientific-toolkit-mcp") == scientific_toolkit_mcp.__version__; import scientific_toolkit_mcp.server; print("Packaged import PASS")')
