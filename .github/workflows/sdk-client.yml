name: Official MCP SDK client interoperability
on:
  push:
    branches: [main]
    paths:
      - scripts/sdk_client_smoke.py
      - .github/workflows/sdk-client.yml
      - scientific_toolkit_mcp/**
  pull_request:
    paths:
      - scripts/sdk_client_smoke.py
      - .github/workflows/sdk-client.yml
      - scientific_toolkit_mcp/**
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  streamable-http:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install toolkit and official MCP Python SDK
        # Same major as the package test extra (pyproject.toml). The SDK smoke
        # uses mcp>=2's streamable_http_client/httpx2 API; installing the older
        # 1.x SDK here tested a client the project itself no longer supports.
        run: |
          python -m pip install -e .
          python -m pip install "mcp>=2,<3"
      - name: Real client/server MCP session over authenticated loopback HTTP
        run: python scripts/sdk_client_smoke.py
