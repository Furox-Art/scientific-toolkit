name: Real upstream MCP integration
on:
  push:
    branches: [main]
    paths:
      - scripts/upstream_smoke.py
      - .github/workflows/real-upstream.yml
      - scientific_toolkit_mcp/**
  pull_request:
    paths:
      - scripts/upstream_smoke.py
      - .github/workflows/real-upstream.yml
      - scientific_toolkit_mcp/**
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  upstream-cli-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - profile: axiomize
            repository: Furox-Art/axiomize
          - profile: scientific-computing-system
            repository: Furox-Art/scientific-computing-system
          - profile: scientific-computing-system-2.0
            repository: Furox-Art/scientific-computing-system-2.0
          - profile: plan-auditor
            repository: Furox-Art/plan-auditor
          - profile: quantum-reasoning-skill
            repository: Furox-Art/quantum-reasoning-skill
          - profile: axiomize-quantum-skills-2.0
            repository: Furox-Art/axiomize-quantum-skills-2.0
          - profile: eq-layer
            repository: Furox-Art/eq-layer
          - profile: literature-evidence-mcp
            repository: Furox-Art/literature-evidence-mcp
          - profile: nomosguard
            repository: Furox-Art/nomosguard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      # A shared setup-python cache key can save only the first completed
      # matrix job's wheels, leaving other upstream repositories uncached.
      - name: Cache pip builds for this upstream repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: upstream-pip-${{ runner.os }}-3.12-${{ matrix.profile }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            upstream-pip-${{ runner.os }}-3.12-${{ matrix.profile }}-
      - run: python -m pip install -e .
      # Fetching the published distributions back from PyPI would count toward
      # their public download statistics, so CI exercises the upstream source.
      - name: Install real upstream package from GitHub source
        run: python -m pip install "git+https://github.com/${{ matrix.repository }}.git@main"
      - name: Invoke adapter against installed CLI
        run: python scripts/upstream_smoke.py "${{ matrix.profile }}"
  remote-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check Render public health and denied anonymous POST
        run: |
          python - <<'PY'
          import json,time,urllib.request,urllib.error
          url="https://scientific-toolkit.onrender.com"
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(url+"/health",timeout=95) as r:
                      health=json.load(r)
                  break
              except (OSError,ValueError):
                  if attempt==2: raise
                  time.sleep(5)
          assert health.get("status")=="ok",health
          assert health.get("transport")=="streamable-http",health
          req=urllib.request.Request(url+"/mcp",
              data=b'{"jsonrpc":"2.0","id":1,"method":"tools/list"}',
              headers={"Content-Type":"application/json","Accept":"application/json, text/event-stream"},
              method="POST")
          try:
              urllib.request.urlopen(req,timeout=95)
          except urllib.error.HTTPError as e:
              assert e.code==401,f"expected 401, got {e.code}"
          else:
              raise AssertionError("Anonymous MCP tools unexpectedly accessible")
          print("PASS live HTTPS health and anonymous 401")
          PY
