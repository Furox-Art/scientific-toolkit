name: Bug report
description: Report gateway behavior that contradicts the documentation
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for defects in the MCP gateway, its transports, adapters,
        packaging, or documentation. The nine upstream scientific packages are
        separate projects; report their own behavior in their repositories.

        If this is a security issue, do not file it publicly. Use the private
        route in [SECURITY.md](https://github.com/Furox-Art/scientific-toolkit/blob/main/SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: Describe the actual behavior and the documented behavior. Link or name the section that says otherwise.
      placeholder: |
        `toolkit_doctor` reports ... but the README says ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest commands or MCP requests that show the problem. Remove tokens, private paths, and workspace contents.
      placeholder: |
        1. Install ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Exact output and exit code
      description: Paste the full error or response. Include the process exit code when a command failed.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Gateway version and install source
      description: The version from `importlib.metadata.version("scientific-toolkit-mcp")`, and whether it came from PyPI or an editable checkout.
      placeholder: "0.3.x from PyPI"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Entry point
      multiple: true
      options:
        - "Local stdio: python -m scientific_toolkit_mcp"
        - "HTTP: python -m scientific_toolkit_mcp.http_server"
        - "Hosted Render deployment"
        - "Packaging, installation, or import"
        - "Documentation"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: upstream
    attributes:
      label: Upstream tool involved
      description: Select every upstream package that took part. Choose "Gateway only" if no upstream CLI ran.
      multiple: true
      options:
        - "Gateway only"
        - "axiomize"
        - "scientific-computing-system"
        - "scientific-computing-system-2.0"
        - "plan-auditor"
        - "quantum-reasoning-skill"
        - "axiomize-quantum-skills-2.0"
        - "eq-layer"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, MCP client, and any relevant upstream CLI versions.
      placeholder: "Windows 11, CPython 3.12, Cursor 1.x"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: toolkit_doctor output
      description: Optional. Paste the JSON result; remove private paths if necessary.
      render: json
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the open and closed issues for this problem.
          required: true
        - label: I read SECURITY.md and this is not a vulnerability.
          required: true
        - label: I removed bearer tokens, OAuth credentials, private paths, and private workspace data.
          required: true
