[build-system]
requires = ["setuptools>=84.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-toolkit-mcp"
version = "0.4.1"
description = "Provider-neutral local and remote MCP hub for nine Furox-Art public research tools"
keywords = ["model-context-protocol", "mcp", "mcp-server", "mcp-gateway", "scientific-computing", "ai-agents", "research-tools", "python", "interoperability", "agent-skills"]
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Furox-Art"}]
license = "Apache-2.0"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
oauth = ["PyJWT[crypto]>=2.15.1,<3"]
# Mirrors the test install in .github/workflows/tests.yml; setuptools is needed
# because the package is built with setuptools and the extras are resolved
# against the same floor as [build-system].
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "mcp>=2.3.0,<3",
    "setuptools>=84.2.0",
]

[project.scripts]
scientific-toolkit-mcp = "scientific_toolkit_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Furox-Art/scientific-toolkit"
Issues = "https://github.com/Furox-Art/scientific-toolkit/issues"
Documentation = "https://github.com/Furox-Art/scientific-toolkit/blob/main/README.md"
Source = "https://github.com/Furox-Art/scientific-toolkit"
Repository = "https://github.com/Furox-Art/scientific-toolkit"

[tool.setuptools.packages.find]
include = ["scientific_toolkit_mcp*"]
