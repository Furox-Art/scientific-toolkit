[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "furox-scientific-toolkit-mcp"
version = "0.1.0"
description = "Provider-neutral local and remote MCP hub for seven Furox-Art public research tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Furox-Art"}]
license = "Apache-2.0"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
scientific-toolkit-mcp = "scientific_toolkit_mcp.server:main"

[project.urls]
Source = "https://github.com/Furox-Art/scientific-toolkit"

[tool.setuptools.packages.find]
include = ["scientific_toolkit_mcp*"]
