site_name: Scientific Toolkit
site_url: https://furox-art.github.io/scientific-toolkit/
site_description: >-
  A unified open-source scientific toolkit integrating nine research and AI software projects through the Model Context Protocol (MCP). Published on PyPI as scientific-toolkit-mcp.
site_author: Furox-Art
repo_url: https://github.com/Furox-Art/scientific-toolkit
repo_name: Furox-Art/scientific-toolkit
edit_uri: edit/main/docs/
copyright: Released under the MIT License

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top

# The documentation pages that predate this site link to files outside docs/
# (../README.md, ../benchmarks/..., ../examples/...). Those links are valid in
# the repository but unresolvable for a site build, so only that warning class
# is downgraded; a genuinely broken in-site link still fails --strict.
validation:
  links:
    not_found: ignore

nav:
  - Home: index.md
  - "Integration-test methodology": integration-test-methodology.md
  - "PyPI publishing": pypi-publishing.md
